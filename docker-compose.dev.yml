services:
  flashcards-dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: flashcards-decks-dev
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      AUTH_SECRET: "local-development-secret-change-me"
      APP_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "false"
      ADMIN_API_KEY: "local-development-api-key-change-me"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
    command: >-
      sh -c "npx prisma migrate deploy && npm run dev -- -H 0.0.0.0"
