services:
  flashcards:
    platform: linux/amd64
    image: ghcr.io/shuach613/flashcards-decks:latest
    container_name: flashcards-decks
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - /volume1/flashcards/data:/app/data
    environment:
      DATABASE_URL: file:/app/data/flashcards.db
      # Replace every value below before the first deployment.
      AUTH_SECRET: "replace-with-at-least-32-random-characters"
      # Optional. Keep this stable after enabling MFA; blank uses AUTH_SECRET.
      MFA_ENCRYPTION_KEY: ""
      # Public URL served by DSM's internal reverse proxy.
      APP_URL: "https://flashcards.example.com"
      # Used only when the persistent database has no users yet.
      ADMIN_INITIAL_EMAIL: "admin@example.com"
      ADMIN_INITIAL_PASSWORD: "replace-with-a-temporary-password"
      ADMIN_API_KEY: "replace-with-at-least-32-random-characters"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "your-email@example.com"
      SMTP_PASSWORD: "your-smtp-password-or-app-password"
      SMTP_FROM: "ShuachCloud <your-email@example.com>"
      AUTH_TRUST_HOST: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
